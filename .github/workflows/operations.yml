name: Operations Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operations-tests:
    name: operations-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Operations guard tests
        run: node --test tests/runner/operations.test.mjs
      - name: Deployment, health, backup, restore and rollback rehearsal
        run: node scripts/run-operations-tests.mjs
