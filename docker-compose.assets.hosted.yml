services:
  app:
    environment:
      ASSET_STORAGE_ENDPOINT: ${ASSET_STORAGE_ENDPOINT:?ASSET_STORAGE_ENDPOINT is required}
      ASSET_STORAGE_BUCKET: ${ASSET_STORAGE_BUCKET:?ASSET_STORAGE_BUCKET is required}
      ASSET_STORAGE_REGION: ${ASSET_STORAGE_REGION:-us-east-1}
      ASSET_STORAGE_PATH_STYLE: ${ASSET_STORAGE_PATH_STYLE:-false}
      ASSET_STORAGE_ACCESS_KEY_FILE: /run/secrets/asset_storage_access_key
      ASSET_STORAGE_SECRET_KEY_FILE: /run/secrets/asset_storage_secret_key
    secrets:
      - asset_storage_access_key
      - asset_storage_secret_key
secrets:
  asset_storage_access_key:
    external: true
    name: ${ASSET_STORAGE_ACCESS_KEY_SECRET_NAME:-thunderstrux_asset_storage_access_key}
  asset_storage_secret_key:
    external: true
    name: ${ASSET_STORAGE_SECRET_KEY_SECRET_NAME:-thunderstrux_asset_storage_secret_key}
