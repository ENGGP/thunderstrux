services:
  db:
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e-disposable-only
      POSTGRES_DB: thunderstrux_e2e_test
    volumes:
      - test_database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U e2e -d thunderstrux_e2e_test]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    image: thunderstrux-p216-app:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_ORIGIN: http://localhost:3100
    env_file: ${E2E_RUNTIME_FILE:?Run through pnpm test:e2e}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://e2e:e2e-disposable-only@db:5432/thunderstrux_e2e_test
      AUTH_URL: http://localhost:3100
      NEXTAUTH_URL: http://localhost:3100
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      TRUSTED_APP_ORIGINS: http://localhost:3100
      RATE_LIMIT_ENABLED: 'true'
      RATE_LIMIT_REDIS_URL: redis://redis:6379
      PORT: '3100'
      RESEND_API_KEY: re_capture_only
      EMAIL_FROM: 'Thunderstrux <synthetic@example.com>'
      THUNDERSTRUX_MAIL_CAPTURE_URL: http://mail-capture:8025/emails
    ports:
      - '127.0.0.1:3100:3100'
    command: [node, node_modules/next/dist/bin/next, start, --hostname, 0.0.0.0, --port, '3100']
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      mail-capture:
        condition: service_started
      redis:
        condition: service_healthy
  mail-capture:
    image: thunderstrux-p216-app:local
    command: [node, scripts/mail-capture.mjs]
    restart: "no"
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  migration:
    image: thunderstrux-p216-app:local
    env_file: ${E2E_RUNTIME_FILE:?Run through pnpm test:e2e}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://e2e:e2e-disposable-only@db:5432/thunderstrux_e2e_test
    command: [node, node_modules/prisma/build/index.js, migrate, deploy]
    depends_on:
      db:
        condition: service_healthy
  runner:
    image: thunderstrux-p216-runner:local
    build:
      context: .
      dockerfile: docker/Dockerfile.e2e
    network_mode: service:app
    env_file: ${E2E_RUNTIME_FILE:?Run through pnpm test:e2e}
    environment:
      DATABASE_URL: postgresql://e2e:e2e-disposable-only@db:5432/thunderstrux_e2e_test
      INTEGRATION_DATABASE_URL: postgresql://e2e:e2e-disposable-only@db:5432/thunderstrux_e2e_test
      RESEND_API_KEY: re_capture_only
      EMAIL_FROM: synthetic@example.com
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      THUNDERSTRUX_MAIL_CAPTURE_URL: http://mail-capture:8025/emails
      E2E_BASE_URL: http://localhost:3100
      CI: ${CI:-}
    volumes:
      - ${E2E_OUTPUT_DIR:?Run through pnpm test:e2e}:/app/test-results
    profiles: [test]
  stripe:
    image: stripe/stripe-cli:v1.33.0@sha256:182ed214675d0807de1983dbf0af810c8287957666d0f2b7a949dc24f81e4902
    env_file: ${E2E_RUNTIME_FILE:?Run through pnpm test:payments:staging}
    command: [listen, --events, 'checkout.session.completed,checkout.session.expired,refund.created,refund.updated,refund.failed', --forward-to, 'http://app:3100/api/payments/webhook']
    profiles: [staging]
volumes:
  test_database:
