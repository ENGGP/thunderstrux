services:
  db:
    image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e-disposable-only
      POSTGRES_DB: thunderstrux_e2e_test
    volumes:
      - test_database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U e2e -d thunderstrux_e2e_test]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    image: thunderstrux-e2e-app:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    env_file: ${E2E_RUNTIME_FILE:?Run through pnpm test:e2e}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://e2e:e2e-disposable-only@db:5432/thunderstrux_e2e_test
      AUTH_URL: http://localhost:3100
      NEXTAUTH_URL: http://localhost:3100
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      TRUSTED_APP_ORIGINS: http://localhost:3100
      RATE_LIMIT_ENABLED: 'true'
      RATE_LIMIT_REDIS_URL: redis://redis:6379
      PORT: '3100'
      RESEND_API_KEY: re_capture_only
      EMAIL_FROM: 'Thunderstrux <synthetic@example.com>'
      THUNDERSTRUX_MAIL_CAPTURE_URL: http://mail-capture:8025/emails
      ASSET_STORAGE_ENDPOINT: http://object-store:8333
      ASSET_STORAGE_BUCKET: test-assets
      ASSET_STORAGE_PATH_STYLE: "true"
      ASSET_STORAGE_ACCESS_KEY: test-assets
      ASSET_STORAGE_SECRET_KEY: disposable-test-storage-only
    ports:
      - '127.0.0.1:3100:3100'
    command: [node, server.js]
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      mail-capture:
        condition: service_started
      redis:
        condition: service_healthy
      object-store:
        condition: service_started
  object-store:
    image: thunderstrux-assets:local
    build:
      context: .
      dockerfile: docker/Dockerfile.assets
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: test-assets
      AWS_SECRET_ACCESS_KEY: disposable-test-storage-only
      S3_BUCKET: test-assets
    volumes:
      - test_assets:/data
    mem_limit: 512m
    cpus: 1
    security_opt: ["no-new-privileges:true"]
    read_only: true
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000"]
  mail-capture:
    image: thunderstrux-e2e-ops:local
    command: [node, scripts/mail-capture.mjs]
    restart: "no"
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  # T43: migrations run from the ops image, as in production.
  migration:
    image: thunderstrux-e2e-ops:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ops
    env_file: ${E2E_RUNTIME_FILE:?Run through pnpm test:e2e}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://e2e:e2e-disposable-only@db:5432/thunderstrux_e2e_test
    command: [node, node_modules/prisma/build/index.js, migrate, deploy]
    depends_on:
      db:
        condition: service_healthy
  tests:
    image: thunderstrux-e2e-tests:local
    build:
      context: .
      dockerfile: docker/Dockerfile.e2e
    network_mode: service:app
    env_file: ${E2E_RUNTIME_FILE:?Run through pnpm test:e2e}
    environment:
      DATABASE_URL: postgresql://e2e:e2e-disposable-only@db:5432/thunderstrux_e2e_test
      INTEGRATION_DATABASE_URL: postgresql://e2e:e2e-disposable-only@db:5432/thunderstrux_e2e_test
      INTEGRATION_REDIS_URL: redis://redis:6379
      ASSET_STORAGE_ENDPOINT: http://object-store:8333
      ASSET_STORAGE_BUCKET: test-assets
      ASSET_STORAGE_PATH_STYLE: "true"
      ASSET_STORAGE_ACCESS_KEY: test-assets
      ASSET_STORAGE_SECRET_KEY: disposable-test-storage-only
      # Staging (T45) sends ticket emails through Resend's test sink; other runs keep the capture-only key.
      RESEND_API_KEY: ${E2E_RESEND_API_KEY:-re_capture_only}
      EMAIL_FROM: ${E2E_EMAIL_FROM:-synthetic@example.com}
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      THUNDERSTRUX_MAIL_CAPTURE_URL: http://mail-capture:8025/emails
      E2E_BASE_URL: http://localhost:3100
      CI: ${CI:-}
    volumes:
      - ${E2E_OUTPUT_DIR:?Run through pnpm test:e2e}:/app/test-results
    profiles: [test]
  stripe:
    image: stripe/stripe-cli:v1.53.1@sha256:11c46caeead82e329f14823dd622d494b4cc8c1b9766f724d122d2af42c97540
    env_file: ${E2E_RUNTIME_FILE:?Run through pnpm test:payments:staging}
    # --latest: events at Stripe's latest version (the app's pin, 2026-09-30.endive), not the account default.
    command: [listen, --latest, --events, 'checkout.session.completed,checkout.session.expired,refund.created,refund.updated,refund.failed,charge.dispute.created,charge.dispute.updated,charge.dispute.closed', --forward-to, 'http://app:3100/api/payments/webhook']
    profiles: [staging]
volumes:
  test_database:
  test_assets:
