services:
  app:
    read_only: true
    init: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: ${APP_PIDS_LIMIT:-256}
    cpus: ${APP_CPUS:-1.0}
    mem_limit: ${APP_MEMORY_LIMIT:-1g}
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700
      - /home/node/.cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700
      - /app/.next-build/cache:rw,noexec,nosuid,size=256m,uid=1000,gid=1000,mode=0700
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migration:
