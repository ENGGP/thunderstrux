services:
  object-store:
    image: thunderstrux-assets:local
    build:
      context: .
      dockerfile: docker/Dockerfile.assets
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: operations-assets
      AWS_SECRET_ACCESS_KEY: disposable-operations-storage-only
      S3_BUCKET: operations-assets
    volumes:
      - operations_assets:/data
    mem_limit: 512m
    cpus: 1
    security_opt: ["no-new-privileges:true"]
    read_only: true
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000"]
  asset-tools:
    image: ${APP_IMAGE:-thunderstrux-app:local}
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://ops:ops-disposable-only@db:5432/ops_app_test?schema=public
      ASSET_STORAGE_ENDPOINT: http://object-store:8333
      ASSET_STORAGE_BUCKET: operations-assets
      ASSET_STORAGE_PATH_STYLE: "true"
      ASSET_STORAGE_ACCESS_KEY: operations-assets
      ASSET_STORAGE_SECRET_KEY: disposable-operations-storage-only
    command: ["node", "scripts/rehearse-assets.mjs"]
  app:
    environment:
      DATABASE_URL: postgresql://ops:ops-disposable-only@db:5432/ops_app_test?schema=public
    ports:
      - "127.0.0.1:${APP_PORT:-3200}:${PORT:-3000}"
  migration:
    environment:
      DATABASE_URL: postgresql://ops:ops-disposable-only@db:5432/ops_app_test?schema=public
  db:
    env_file: !reset []
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops-disposable-only
      POSTGRES_DB: ops_app_test
volumes:
  operations_assets:
