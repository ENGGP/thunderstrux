name: thunderstrux

# What every job shares. A setting goes here unless only one job reads it, so a new
# one can't be missed on a job: a notice queued with a money step rolls that step
# back when its settings are missing (DEF-065).
x-worker-env: &worker-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
  EMAIL_FROM: ${EMAIL_FROM:-}
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  WORKER_TIMEOUT_SECONDS: ${WORKER_TIMEOUT_SECONDS:-300}

x-worker: &worker
  image: ${OPS_IMAGE:-thunderstrux-ops:local}
  restart: "no"
  profiles: ["workers"]
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    image: ${APP_IMAGE:-thunderstrux-app:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
      # T43: the web image serves traffic; migration and workers use the ops image.
      target: web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      THUNDERSTRUX_RUNTIME_CONTAINER: "true"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      MFA_ENFORCEMENT_MODE: ${MFA_ENFORCEMENT_MODE:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      LEGACY_ORGANISATION_ACCESS_MODE: ${LEGACY_ORGANISATION_ACCESS_MODE:-}
      AUTH_URL: ${AUTH_URL:?AUTH_URL is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      TRUSTED_APP_ORIGINS: ${TRUSTED_APP_ORIGINS:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-redis://redis:6379}
      RATE_LIMIT_KEY_PREFIX: ${RATE_LIMIT_KEY_PREFIX:-thunderstrux}
      RATE_LIMIT_TRUSTED_PROXY_HEADER: ${RATE_LIMIT_TRUSTED_PROXY_HEADER:-x-forwarded-for}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      STRIPE_ACCOUNTS_WEBHOOK_SECRET: ${STRIPE_ACCOUNTS_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      NOTIFICATION_ENCRYPTION_KEY: ${NOTIFICATION_ENCRYPTION_KEY:-}
      ASSET_STORAGE_ENDPOINT: ${ASSET_STORAGE_ENDPOINT:-}
      ASSET_STORAGE_BUCKET: ${ASSET_STORAGE_BUCKET:-}
      ASSET_STORAGE_REGION: ${ASSET_STORAGE_REGION:-us-east-1}
      ASSET_STORAGE_PATH_STYLE: ${ASSET_STORAGE_PATH_STYLE:-false}
      ASSET_STORAGE_ACCESS_KEY: ${ASSET_STORAGE_ACCESS_KEY:-}
      ASSET_STORAGE_SECRET_KEY: ${ASSET_STORAGE_SECRET_KEY:-}
      ASSET_STORAGE_ACCESS_KEY_FILE: ${ASSET_STORAGE_ACCESS_KEY_FILE:-}
      ASSET_STORAGE_SECRET_KEY_FILE: ${ASSET_STORAGE_SECRET_KEY_FILE:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      PLATFORM_SUPPORT_EMAIL: ${PLATFORM_SUPPORT_EMAIL:-}
      PORT: ${PORT:-3000}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:${PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # T43: the web image is Next's standalone server.
    command: ["node", "server.js"]

  migration:
    image: ${OPS_IMAGE:-thunderstrux-ops:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ops
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]

  email-worker:
    <<: *worker
    environment:
      <<: *worker-env
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_OUTBOX_BATCH_SIZE: ${EMAIL_OUTBOX_BATCH_SIZE:-25}
      EMAIL_OUTBOX_MAX_ATTEMPTS: ${EMAIL_OUTBOX_MAX_ATTEMPTS:-5}
      EMAIL_OUTBOX_PROCESSING_TIMEOUT_SECONDS: ${EMAIL_OUTBOX_PROCESSING_TIMEOUT_SECONDS:-600}
    command: ["node", "scripts/process-email-outbox.mjs"]

  notification-worker:
    <<: *worker
    environment:
      <<: *worker-env
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATION_ENCRYPTION_KEY: ${NOTIFICATION_ENCRYPTION_KEY:-}
    command: ["node", "scripts/process-notifications.mjs"]

  # PAY-024: also confirms pending checkouts with Stripe before expiring them,
  # so it needs what the payments webhook needs to fulfil an order.
  stale-order-worker:
    <<: *worker
    environment:
      <<: *worker-env
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      NOTIFICATION_ENCRYPTION_KEY: ${NOTIFICATION_ENCRYPTION_KEY:-}
    command: ["node", "scripts/process-stale-orders.mjs"]

  compensation-worker:
    <<: *worker
    environment:
      <<: *worker-env
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      NOTIFICATION_ENCRYPTION_KEY: ${NOTIFICATION_ENCRYPTION_KEY:-}
    command: ["node", "scripts/process-compensation-refunds.mjs"]

  checkout-recovery-worker:
    <<: *worker
    environment:
      <<: *worker-env
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    command: ["node", "scripts/process-checkout-attempts.mjs"]

  # T42: queue backlog, oldest-age and stale-job alerts. Database only.
  monitor-worker:
    <<: *worker
    environment: *worker-env
    command: ["node", "scripts/process-operations-monitor.mjs"]

  db:
    image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    restart: unless-stopped
    env_file:
      - .env.db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
